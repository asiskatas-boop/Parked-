name: Build Android APK

on:
  push:
    branches: [ main, 'ci/**' ]
  pull_request:
  workflow_dispatch:

# The build only reads the repo; its token can't write anything.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # A fixed debug signing key lets each new APK install over the previous one
      # instead of forcing an uninstall (which wipes the saved spot and fuel data).
      # Add the base64 keystore as the DEBUG_KEYSTORE_BASE64 repository secret.
      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            # Pasting into the GitHub form often adds spaces, line breaks or quotes;
            # keep only base64 characters before decoding.
            clean=$(printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
            echo "Secret length after cleanup: ${#clean} characters (expected 3556)."
            if printf '%s' "$clean" | base64 -d > /tmp/debug.keystore 2>/dev/null &&
               keytool -list -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
              cp /tmp/debug.keystore ~/.android/debug.keystore
              mv /tmp/debug.keystore "$RUNNER_TEMP/parked-debug.keystore"
              # Point the Android build at the key explicitly (app/build.gradle.kts);
              # it does not reliably pick up ~/.android/debug.keystore on its own.
              echo "PARKED_DEBUG_KEYSTORE=$RUNNER_TEMP/parked-debug.keystore" >> "$GITHUB_ENV"
              echo "Using the saved debug signing key."
            else
              rm -f /tmp/debug.keystore ~/.android/debug.keystore
              echo "::warning::DEBUG_KEYSTORE_BASE64 is set but is not a valid debug keystore (${#clean} base64 characters after cleanup, expected 3556). Building with a temporary key instead. Re-paste the whole contents of DEBUG_KEYSTORE_BASE64.txt."
            fi
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set, so this APK has a new signing key and cannot install over a previous build."
          fi

      - name: Build Parked APK
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          status=0
          gradle :app:assembleRelease --console=plain > build.log 2>&1 || status=$?
          cat build.log
          if [ "$status" -ne 0 ]; then
            # Surface compiler/resource errors as a single annotation so they are
            # readable from the check run without downloading the full log.
            errors=$(grep -E '^e: |error:|ERROR:|What went wrong' -A3 build.log | head -c 60000 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${errors}"
            exit "$status"
          fi

      - name: Check map key
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          if [ -z "$CARTO_API_KEY" ]; then echo "::warning title=Map key::CARTO_API_KEY is not set, so the map shows an API KEY REQUIRED watermark."; else echo "::notice title=Map key::CARTO key is set."; fi

      # Shows the signing key's fingerprint on every run. It must stay the same
      # from build to build, or Android refuses to install an update.
      # Also refuses to publish an APK that is debuggable or signed with another key.
      - name: Check signing key and debuggable flag
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          fp=$("$tools/apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256' | awk '{print $NF}')
          echo "Signing certificate SHA-256: $fp"
          echo "::notice title=Signing key::SHA-256 ${fp}"
          if [ "$fp" != "a779dc23c4314246079ad6259b621dc6aacdc633b3a07d11e278dda1b6a87a43" ]; then
            echo "::error title=Signing key::This APK is not signed with the fixed key, so it would not install over the app."
            exit 1
          fi
          manifest=$("$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          # A release build has no debuggable attribute at all; any mention fails.
          if printf '%s' "$manifest" | grep -q 'debuggable'; then
            echo "::error title=Debuggable::The APK is debuggable."
            exit 1
          fi
          # Web pages must not be able to open parked://save (it would move the car's spot).
          if printf '%s' "$manifest" | grep -q 'android.intent.category.BROWSABLE'; then
            echo "::error title=Web links::The app accepts web links again; parked://save must stay NFC-only."
            exit 1
          fi
          printf '%s' "$manifest" | grep -q 'android.nfc.action.NDEF_DISCOVERED' || { echo "::error title=NFC::The NFC tag entry is missing."; exit 1; }
          echo "::notice title=Checks::Not debuggable, no web links, NFC tag entry present."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Parked-apk
          path: app/build/outputs/apk/release/app-release.apk
